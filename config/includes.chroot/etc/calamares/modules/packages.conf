---
# Boykisser Linux — packages module disabled :3
#
# The stock calamares-settings-debian packages.conf removes the live-* packages
# with apt. Calamares' apt backend runs `apt-get remove` AND `apt-get --purge -y
# autoremove` for every removal, and on the freshly-copied offline target one of
# those apt invocations aborts the install with "Package Manager error ...
# returned error code 110". Even `try_remove` isn't safe because the trailing
# autoremove runs unconditionally.
#
# The live-package cleanup is done instead by /usr/local/bin/boykisser-live-cleanup
# (dpkg-based, never fails), invoked from the contextualprocess module.
backend: apt
update_db: false

operations: []
