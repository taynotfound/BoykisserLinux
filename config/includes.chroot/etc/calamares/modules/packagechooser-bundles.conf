---
# Boykisser Linux — optional app bundles :3
# A second packagechooser instance (id "bundles"). The user can tick any
# combination; the choice lands in GlobalStorage as "packagechooser_bundles"
# (comma-separated item ids, in the order below) and is consumed by the
# contextualprocess@bundles instance, which installs the packages from the
# internet after unpack. No network -> the installer skips them gracefully.

mode: optionalmultiple
method: legacy

labels:
    step: "App bundles"

items:
  - id: gaming
    name: "Gaming"
    description: "Steam, Lutris, GameMode and MangoHud — ready to game out of
                  the box. Needs internet during install."
    screenshot: "/usr/share/boykisser/logo.png"

  - id: streaming
    name: "Streaming & Creation"
    description: "OBS Studio, Kdenlive and Audacity for streaming, video and
                  audio work. Needs internet during install."
    screenshot: "/usr/share/boykisser/logo.png"

  - id: dev
    name: "Development"
    description: "git, build-essential, Python, Node.js and Podman for hacking
                  on things. Needs internet during install."
    screenshot: "/usr/share/boykisser/logo-dark.png"
