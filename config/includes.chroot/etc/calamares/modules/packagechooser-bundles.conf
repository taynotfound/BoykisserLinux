---
# Boykisser Linux — optional app bundles :3
#
# This instance runs on the QML packagechooser (packagechooserq@bundles) so we
# get REAL checkboxes instead of the widget module's ctrl-click multi-select
# list. The UI lives in the branding directory: bundles.qml (qmlFilename below,
# resolved against /etc/calamares/branding/boykisser/).
#
# method: legacy  -> the QML sets config.packageChoice to a comma-joined list
# of ticked bundle ids in fixed order (gaming,streaming,dev,office); Calamares
# stores it in GlobalStorage as "packagechooser_bundles", which
# contextualprocess-bundles.conf branches on.

method: legacy

labels:
    step: "App bundles"

qmlSearch: branding
qmlFilename: bundles
