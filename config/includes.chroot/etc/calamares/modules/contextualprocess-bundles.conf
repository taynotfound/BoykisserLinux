---
# Boykisser Linux — install the chosen app bundles :3
# Reacts to the "App bundles" chooser (GlobalStorage key
# "packagechooser_bundles"). packagechooser joins multi-selections with commas
# in item order (gaming, streaming, dev, office), so every combination gets a
# branch.
# boykisser-install-bundles is best-effort: no internet or a failed package
# never fails the install.

packagechooser_bundles:
    gaming:
        - command: "/usr/local/bin/boykisser-install-bundles @@ROOT@@ gaming"
          timeout: 3600
    streaming:
        - command: "/usr/local/bin/boykisser-install-bundles @@ROOT@@ streaming"
          timeout: 3600
    dev:
        - command: "/usr/local/bin/boykisser-install-bundles @@ROOT@@ dev"
          timeout: 3600
    office:
        - command: "/usr/local/bin/boykisser-install-bundles @@ROOT@@ office"
          timeout: 3600
    "gaming,streaming":
        - command: "/usr/local/bin/boykisser-install-bundles @@ROOT@@ gaming streaming"
          timeout: 5400
    "gaming,dev":
        - command: "/usr/local/bin/boykisser-install-bundles @@ROOT@@ gaming dev"
          timeout: 5400
    "gaming,office":
        - command: "/usr/local/bin/boykisser-install-bundles @@ROOT@@ gaming office"
          timeout: 5400
    "streaming,dev":
        - command: "/usr/local/bin/boykisser-install-bundles @@ROOT@@ streaming dev"
          timeout: 5400
    "streaming,office":
        - command: "/usr/local/bin/boykisser-install-bundles @@ROOT@@ streaming office"
          timeout: 5400
    "dev,office":
        - command: "/usr/local/bin/boykisser-install-bundles @@ROOT@@ dev office"
          timeout: 5400
    "gaming,streaming,dev":
        - command: "/usr/local/bin/boykisser-install-bundles @@ROOT@@ gaming streaming dev"
          timeout: 7200
    "gaming,streaming,office":
        - command: "/usr/local/bin/boykisser-install-bundles @@ROOT@@ gaming streaming office"
          timeout: 7200
    "gaming,dev,office":
        - command: "/usr/local/bin/boykisser-install-bundles @@ROOT@@ gaming dev office"
          timeout: 7200
    "streaming,dev,office":
        - command: "/usr/local/bin/boykisser-install-bundles @@ROOT@@ streaming dev office"
          timeout: 7200
    "gaming,streaming,dev,office":
        - command: "/usr/local/bin/boykisser-install-bundles @@ROOT@@ gaming streaming dev office"
          timeout: 9000
