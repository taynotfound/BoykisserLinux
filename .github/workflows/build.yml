name: Build ISO

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to publish the build under (e.g. v1.0.0). Blank = nightly-DATE."
        required: false
        default: ""
  workflow_call:
    inputs:
      release_tag:
        description: "Tag passed from calling workflow"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: build-iso
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: full
            netinstall: "0"
            lite: "0"
            iso: boykisser-linux-amd64.iso
            item_suffix: ""
          - variant: netinstall
            netinstall: "1"
            lite: "0"
            iso: boykisser-linux-netinstall-amd64.iso
            item_suffix: "-netinstall"
          - variant: lite
            netinstall: "0"
            lite: "1"
            iso: boykisser-linux-lite-amd64.iso
            item_suffix: "-lite"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need full history to extract changelog diffs between tags

      - name: Restore the live-build package cache
        uses: actions/cache@v4
        with:
          # Downloaded .debs only (not the unpacked bootstrap)  -  saves re-fetching
          # ~2 GB of packages from the Debian mirrors on every run.
          path: |
            cache/packages.bootstrap
            cache/packages.chroot
            cache/packages.binary
          key: lb-debs-${{ matrix.variant }}-${{ hashFiles('config/package-lists/**', 'config/archives/**', 'auto/config') }}
          restore-keys: |
            lb-debs-${{ matrix.variant }}-

      - name: Free up disk space
        run: |
          echo "before:"; df -h /
          sudo rm -rf \
            /opt/hostedtoolcache \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /usr/share/swift \
            /usr/local/.ghcup \
            /usr/local/share/powershell \
            /usr/local/share/chromium \
            /usr/local/lib/node_modules \
            /opt/ghc "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean || true
          sudo docker image prune -af || true
          sudo docker builder prune -af || true
          echo "after:"; df -h /

      - name: Build the builder image
        run: docker build -t boykisser-builder -f docker/Dockerfile.builder docker/

      - name: Toggle the netinstall variant
        if: matrix.netinstall == '1'
        run: |
          # Mirror build.sh --netinstall: keep the heavy apps out of the squashfs
          # and drop the marker the chroot hooks + first-boot service look for.
          extra=config/package-lists/apps-extra.list.chroot
          [ -f "$extra" ] && mv -f "$extra" "$extra.disabled"
          mkdir -p config/includes.chroot/etc/boykisser
          echo "netinstall" > config/includes.chroot/etc/boykisser/netinstall

      - name: Toggle the lite variant
        if: matrix.lite == '1'
        run: |
          # Mirror build.sh --lite: no heavy apps, drop marker so auto/config
          # switches to syslinux-only (BIOS chainload for ancient laptops).
          extra=config/package-lists/apps-extra.list.chroot
          [ -f "$extra" ] && mv -f "$extra" "$extra.disabled"
          mkdir -p config/includes.chroot/etc/boykisser
          echo "lite" > config/includes.chroot/etc/boykisser/lite

      - name: Fetch latest boykisser-tools
        run: |
          urls=$(curl -fsSL https://api.github.com/repos/taynotfound/boykisser-tools/releases/latest \
            | grep -o '"browser_download_url":"[^"]*\.deb"' | cut -d'"' -f4)
          if [ -n "$urls" ]; then
            mkdir -p config/packages.chroot
            for url in $urls; do
              name=$(basename "$url")
              curl -fsSL "$url" -o "config/packages.chroot/$name"
              echo ":3 fetched $name"
            done
          else
            echo "::warning::boykisser-tools release not found  -  skipping"
          fi

      - name: Build the live ISO (${{ matrix.variant }})
        run: |
          docker run --rm --privileged \
            -v "$PWD":/build -w /build \
            boykisser-builder -lc '
              set -e
              # plain clean keeps cache/packages.* (restored above) so apt
              # reuses the cached .debs instead of re-downloading everything
              lb clean || true
              lb config
              lb build
            '
          # the container runs as root  -  make the cache readable for the
          # post-job cache save step
          sudo chmod -R a+rX cache/packages.* 2>/dev/null || true

      - name: Name and checksum the ISO
        id: iso
        run: |
          iso=$(ls -1 *.iso | head -n1)
          mv -f "$iso" "${{ matrix.iso }}"
          sha256sum "${{ matrix.iso }}" | tee "SHA256SUMS-${{ matrix.variant }}"
          echo "size=$(du -h "${{ matrix.iso }}" | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Resolve tag
        id: tag
        run: |
          # Use caller input, then dispatch input, then tag, then nightly fallback
          tag="${{ inputs.release_tag || github.event.inputs.release_tag }}"
          if [ -z "$tag" ]; then
            if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
              tag="${GITHUB_REF_NAME}"
            else
              tag="nightly-$(date +%Y%m%d)"
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "item=boykisser-linux-$tag${{ matrix.item_suffix }}" >> "$GITHUB_OUTPUT"

      - name: Mirror to the Internet Archive
        id: ia
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
          ITEM: ${{ steps.tag.outputs.item }}
          TAG: ${{ steps.tag.outputs.tag }}
          ISO: ${{ matrix.iso }}
          VARIANT: ${{ matrix.variant }}
        run: |
          if [ -z "$IA_ACCESS_KEY" ] || [ -z "$IA_SECRET_KEY" ]; then
            echo "No Internet Archive keys set  -  skipping mirror upload."
            echo "uploaded=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pip install --user internetarchive
          mkdir -p ~/.config/internetarchive
          cat > ~/.config/internetarchive/ia.ini <<EOF
          [s3]
          access = ${IA_ACCESS_KEY}
          secret = ${IA_SECRET_KEY}
          EOF
          ia upload "$ITEM" "$ISO" "SHA256SUMS-${VARIANT}" \
            --metadata="title:Boykisser Linux ${TAG} (${VARIANT})" \
            --metadata="mediatype:software" \
            --metadata="collection:opensource_media" \
            --metadata="subject:linux;debian;boykisser-linux" \
            --metadata="creator:taynotfound" \
            --retries 5
          echo "uploaded=true" >> "$GITHUB_OUTPUT"
          {
            echo "item_url=https://archive.org/details/${ITEM}"
            echo "iso_url=https://archive.org/download/${ITEM}/${ISO}"
            echo "torrent_url=https://archive.org/download/${ITEM}/${ITEM}_archive.torrent"
          } >> "$GITHUB_OUTPUT"

      - name: Split ISO for the GitHub fallback
        run: |
          if [ "${{ matrix.variant }}" = "full" ]; then
            split -b 1900M -d "${{ matrix.iso }}" "${{ matrix.iso }}.part"
            rm -f "${{ matrix.iso }}"
            ls -lh "${{ matrix.iso }}".part* "SHA256SUMS-${{ matrix.variant }}"
          else
            ls -lh "${{ matrix.iso }}" "SHA256SUMS-${{ matrix.variant }}"
          fi

      - name: Write release-notes fragment
        env:
          VARIANT: ${{ matrix.variant }}
          ISO: ${{ matrix.iso }}
          UPLOADED: ${{ steps.ia.outputs.uploaded }}
          ISO_URL: ${{ steps.ia.outputs.iso_url }}
          TORRENT_URL: ${{ steps.ia.outputs.torrent_url }}
          ITEM_URL: ${{ steps.ia.outputs.item_url }}
          SIZE: ${{ steps.iso.outputs.size }}
          TAG: ${{ steps.tag.outputs.tag || github.event.inputs.release_tag }}
        run: |
          if [ "$VARIANT" = "netinstall" ]; then
            heading="### Netinstall ISO  -  slim, needs internet on first boot (~${SIZE})"
            blurb="A much smaller image with just the base desktop, browser and store. The installed system downloads the rest (OBS, VLC, codecs, Steam, VS Code, gaming bits + Flatpaks) on first boot, so it needs an internet connection to finish setup."
          elif [ "$VARIANT" = "lite" ]; then
            heading="### Lite ISO  -  for ancient BIOS laptops (~${SIZE})"
            blurb="Same slim package set as netinstall, but built BIOS-only (syslinux, no grub-efi) with \`nomodeset\` in the default boot line. Made for pre-2010 hardware where the full/netinstall ISOs dump you at a \`grub>\` rescue prompt. dd it to a USB, boot it, done  -  no Ventoy, no chainloading."
          else
            heading="### Full ISO  -  everything offline (~${SIZE})"
            blurb="The complete daily driver: every app is already in the image, installs and runs fully offline."
          fi
          {
            echo "$heading"
            echo
            echo "$blurb"
            echo
            if [ "$UPLOADED" = "true" ]; then
              echo "- **Direct mirror:** ${ISO_URL}"
              echo "- **Torrent:** ${TORRENT_URL} _(can take a few minutes to appear)_"
              echo "- **Mirror page:** ${ITEM_URL}"
              echo
            fi
            
          if [ "$VARIANT" = "netinstall" ] || [ "$VARIANT" = "lite" ]; then
            echo "- **[Download ${ISO}](https://github.com/${{ github.repository }}/releases/download/${TAG}/${ISO})**"
          else
            echo "Parts: download all \`.part*\` files + \`SHA256SUMS\`, then \`cat boykisser-linux-amd64.iso.part* > boykisser-linux-amd64.iso && sha256sum -c SHA256SUMS\`. Full guide: [boykisser.taymaerz.de/docs.html#downloading](https://boykisser.taymaerz.de/docs.html#downloading)"
          fi
          } > "release-notes-${VARIANT}.md"
          cat "release-notes-${VARIANT}.md"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iso-${{ matrix.variant }}
          retention-days: 1
          if-no-files-found: error
          path: |
            ${{ matrix.iso }}
            ${{ matrix.iso }}.part*
            SHA256SUMS-${{ matrix.variant }}
            release-notes-${{ matrix.variant }}.md

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need git history for changelog

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Resolve tag
        id: tag
        run: |
          # Use caller input, then dispatch input, then tag, then nightly fallback
          tag="${{ inputs.release_tag || github.event.inputs.release_tag }}"
          if [ -z "$tag" ]; then
            if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
              tag="${GITHUB_REF_NAME}"
            else
              tag="nightly-$(date +%Y%m%d)"
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # weekly/nightly builds are prereleases; only v* tags are stable
          if [[ "$tag" == v* ]]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Combine checksums and release notes
        env:
          TAG: ${{ steps.tag.outputs.tag || github.event.inputs.release_tag }}
        run: |
          cd dist
          cat SHA256SUMS-* > SHA256SUMS
          rm -f SHA256SUMS-*
          {
            echo '<div align="center">'
            echo '  <img src="https://raw.githubusercontent.com/taynotfound/BoykisserLinux/main/config/includes.chroot/usr/share/boykisser/logo.png" alt="Boykisser Linux Logo" width="200"/>'
            echo "  <h2>Boykisser Linux ${TAG} :3</h2>"
            echo "  <p>Debian 13 (trixie) · amd64 · UEFI + legacy BIOS.</p>"
            echo '</div>'
            echo
            echo "### Changelog"
            echo
            prev_tag=$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || echo "")
            if [ -n "$prev_tag" ]; then
              git log "${prev_tag}..${GITHUB_SHA}" --pretty=format:"* %s" --no-merges | grep -v "^* bump" || echo "* Routine updates."
            else
              echo "* Initial or untracked changes."
            fi
            echo
            echo "<details><summary><b>Installation Instructions & Mirror Links</b></summary>"
            echo
            echo "Three flavours below  -  grab the **full** ISO for an offline daily driver, the **netinstall** ISO for a tiny download that pulls apps on first boot, or the **lite** ISO if your laptop is old enough to remember Vista."
            echo
            [ -f release-notes-full.md ] && cat release-notes-full.md
            [ -f release-notes-netinstall.md ] && cat release-notes-netinstall.md
            [ -f release-notes-lite.md ] && cat release-notes-lite.md
            echo "</details>"
          } > release-notes.md
          rm -f release-notes-full.md release-notes-netinstall.md release-notes-lite.md
          echo "=== notes ==="; cat release-notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Boykisser Linux ${{ steps.tag.outputs.tag }}
          prerelease: ${{ steps.tag.outputs.prerelease }}
          body_path: dist/release-notes.md
          files: |
            dist/boykisser-linux-amd64.iso.part*
            dist/boykisser-linux-netinstall-amd64.iso
            dist/boykisser-linux-lite-amd64.iso
            dist/SHA256SUMS

