name: Build and release .deb

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build .deb
        run: |
          sudo gem install fpm --no-document
          chmod +x bin/boykisser*
          fpm -s dir -t deb -n boykisser-tools \
            -v "${GITHUB_REF_NAME#v}" \
            --description "Boykisser Linux tools and control center" \
            --maintainer "Tay Maerz <marztayron@gmail.com>" \
            --depends python3 --depends python3-gi --depends "gir1.2-gtk-3.0" \
            bin/=/usr/local/bin/
          ls -lh boykisser-tools*.deb

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: boykisser-tools*.deb
          name: boykisser-tools ${{ github.ref_name }}
          body: "Tools update — install with `boykisser update` or `sudo dpkg -i boykisser-tools*.deb`"
