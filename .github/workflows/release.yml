name: Build and release .deb packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install fpm
        run: sudo gem install fpm --no-document

      - name: Make scripts executable
        run: chmod +x bin/boykisser*

      - name: Set version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # ------------------------------------------------------------------ #
      # Individual packages
      # ------------------------------------------------------------------ #

      - name: boykisser-core
        run: |
          fpm -s dir -t deb -n boykisser-core -v "$VERSION" \
            --description "Boykisser Linux - main CLI dispatcher (boykisser command)" \
            --maintainer "Tay Maerz <marztayron@gmail.com>" \
            bin/boykisser=/usr/local/bin/boykisser

      - name: boykisser-center
        run: |
          fpm -s dir -t deb -n boykisser-center -v "$VERSION" \
            --description "Boykisser Linux - graphical control center (GTK3)" \
            --maintainer "Tay Maerz <marztayron@gmail.com>" \
            --depends python3 --depends python3-gi --depends "gir1.2-gtk-3.0" \
            bin/boykisser-center=/usr/local/bin/boykisser-center

      - name: boykisser-update
        run: |
          fpm -s dir -t deb -n boykisser-update -v "$VERSION" \
            --description "Boykisser Linux - system updater (apt + flatpak + self-update)" \
            --maintainer "Tay Maerz <marztayron@gmail.com>" \
            bin/boykisser-update=/usr/local/bin/boykisser-update

      - name: boykisser-doctor
        run: |
          fpm -s dir -t deb -n boykisser-doctor -v "$VERSION" \
            --description "Boykisser Linux - system health check (read-only)" \
            --maintainer "Tay Maerz <marztayron@gmail.com>" \
            bin/boykisser-doctor=/usr/local/bin/boykisser-doctor

      - name: boykisser-nvidia
        run: |
          fpm -s dir -t deb -n boykisser-nvidia -v "$VERSION" \
            --description "Boykisser Linux - NVIDIA proprietary driver installer" \
            --maintainer "Tay Maerz <marztayron@gmail.com>" \
            bin/boykisser-nvidia=/usr/local/bin/boykisser-nvidia

      - name: boykisser-theme
        run: |
          fpm -s dir -t deb -n boykisser-theme -v "$VERSION" \
            --description "Boykisser Linux - theme switcher (light/dark, XFCE + KDE)" \
            --maintainer "Tay Maerz <marztayron@gmail.com>" \
            bin/boykisser-theme=/usr/local/bin/boykisser-theme \
            bin/boykisser-theme-toggle=/usr/local/bin/boykisser-theme-toggle

      - name: boykisser-apps
        run: |
          fpm -s dir -t deb -n boykisser-apps -v "$VERSION" \
            --description "Boykisser Linux - app installer tools (OBS, Steam, VS Code, presets, browser picker, debloat)" \
            --maintainer "Tay Maerz <marztayron@gmail.com>" \
            bin/boykisser-postinstall-apps=/usr/local/bin/boykisser-postinstall-apps \
            bin/boykisser-presets=/usr/local/bin/boykisser-presets \
            bin/boykisser-browser=/usr/local/bin/boykisser-browser \
            bin/boykisser-debloat=/usr/local/bin/boykisser-debloat \
            bin/boykisser-install-bundles=/usr/local/bin/boykisser-install-bundles

      - name: boykisser-system
        run: |
          fpm -s dir -t deb -n boykisser-system -v "$VERSION" \
            --description "Boykisser Linux - system administration tools (cleanup, kernel, autologin, wallpaper, report, welcome)" \
            --maintainer "Tay Maerz <marztayron@gmail.com>" \
            bin/boykisser-cleanup=/usr/local/bin/boykisser-cleanup \
            bin/boykisser-kernel=/usr/local/bin/boykisser-kernel \
            bin/boykisser-autologin=/usr/local/bin/boykisser-autologin \
            bin/boykisser-wallpaper=/usr/local/bin/boykisser-wallpaper \
            bin/boykisser-report=/usr/local/bin/boykisser-report \
            bin/boykisser-welcome=/usr/local/bin/boykisser-welcome \
            bin/boykisser-firstboot=/usr/local/bin/boykisser-firstboot \
            bin/boykisser-live-cleanup=/usr/local/bin/boykisser-live-cleanup \
            bin/boykisser-install-kde=/usr/local/bin/boykisser-install-kde \
            bin/install-boykisser=/usr/local/bin/install-boykisser

      # ------------------------------------------------------------------ #
      # Full bundle metapackage: depends on all individual packages
      # ------------------------------------------------------------------ #

      - name: boykisser-tools (full bundle)
        run: |
          fpm -s empty -t deb -n boykisser-tools -v "$VERSION" \
            --description "Boykisser Linux - full tools bundle (installs all boykisser-* packages)" \
            --maintainer "Tay Maerz <marztayron@gmail.com>" \
            --depends "boykisser-core (>= $VERSION)" \
            --depends "boykisser-center (>= $VERSION)" \
            --depends "boykisser-update (>= $VERSION)" \
            --depends "boykisser-doctor (>= $VERSION)" \
            --depends "boykisser-nvidia (>= $VERSION)" \
            --depends "boykisser-theme (>= $VERSION)" \
            --depends "boykisser-apps (>= $VERSION)" \
            --depends "boykisser-system (>= $VERSION)"
          ls -lh boykisser*.deb

      # ------------------------------------------------------------------ #
      # Publish all debs in one release
      # ------------------------------------------------------------------ #

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.deb"
          name: boykisser-tools ${{ github.ref_name }}
          body: |
            ## Install

            **Full install (recommended):**
            ```sh
            sudo dpkg -i boykisser-tools_*.deb boykisser-*.deb
            sudo apt-get install -f
            ```

            **Or just what you need:**
            | Package | What it does |
            |---|---|
            | `boykisser-core` | `boykisser` CLI dispatcher |
            | `boykisser-center` | Graphical control center (GTK3) |
            | `boykisser-update` | System updater (apt + flatpak) |
            | `boykisser-doctor` | Health check |
            | `boykisser-nvidia` | NVIDIA driver installer |
            | `boykisser-theme` | Theme switcher (light/dark) |
            | `boykisser-apps` | App installer tools |
            | `boykisser-system` | System admin tools |
            | `boykisser-tools` | Meta-package (pulls all of the above) |

            Update anytime: `boykisser update`
