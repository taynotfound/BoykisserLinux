name: Weekly Kernel Update

on:
  schedule:
    # Mondays 03:00 UTC
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump Version
        id: bump
        run: |
          MONTH=$(date -u +%-m)
          YEAR=$(date -u +%y)
          REVISION=0
          while read -r tag; do
            if [[ "$tag" =~ ^v${MONTH}\.${YEAR}\.[0-9]+$ ]]; then
              REVISION=${tag##*.}
              break
            fi
          done < <(git tag --list "v${MONTH}.${YEAR}.*" --sort=-version:refname)
          NEW_VERSION="v${MONTH}.${YEAR}.$((REVISION + 1))"
          echo "Creating weekly release tag: $NEW_VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$NEW_VERSION"
          git push origin "$NEW_VERSION"
          echo "new_tag=$NEW_VERSION" >> "$GITHUB_OUTPUT"

    outputs:
      new_tag: ${{ steps.bump.outputs.new_tag }}

  trigger-build:
    needs: bump-and-build
    uses: ./.github/workflows/build.yml
    with:
      release_tag: ${{ needs.bump-and-build.outputs.new_tag }}
    secrets: inherit
